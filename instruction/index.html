<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KidsNote Backup - 브라우저 선택</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f9;color:#172237;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;padding:24px}
    main{width:min(720px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:18px;box-shadow:0 12px 34px rgba(16,24,40,.08);padding:34px}
    h1{margin:0 0 8px;font-size:28px;text-align:center}
    .intro{margin:0 0 28px;color:#667085;text-align:center}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .browser{position:relative;display:block;text-decoration:none;color:inherit;border:1px solid #d0d5dd;border-radius:14px;padding:24px 20px;transition:.16s ease;background:#fff}
    .browser:hover{transform:translateY(-2px);border-color:#98a2b3;box-shadow:0 8px 22px rgba(16,24,40,.08)}
    .browser.recommended{border:2px solid #0f766e;background:#f0fdfa}
    .badge{position:absolute;top:12px;right:12px;background:#0f766e;color:#fff;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}
    .name{font-size:20px;font-weight:800;margin-bottom:5px}
    .desc{color:#667085;font-size:13px}
    .arrow{display:inline-block;margin-top:16px;font-weight:800;color:#175cd3}
    .recommended .arrow{color:#0f766e}
    footer{margin-top:24px;padding-top:18px;border-top:1px solid #e4e7ec;color:#98a2b3;font-size:12px;text-align:center}
    @media(max-width:580px){main{padding:26px 18px}.choices{grid-template-columns:1fr}h1{font-size:24px}}
  </style>
</head>
<body>
<main>
  <h1>어떤 브라우저를 사용하시나요?</h1>
  <p class="intro">사용 중인 브라우저를 선택하면 해당 설치·사용 매뉴얼로 바로 이동합니다.</p>

  <div class="choices">
    <a class="browser recommended" href="edge.html">
      <span class="badge">추천</span>
      <div class="name">Microsoft Edge <span aria-hidden="true">✓</span></div>
      <div class="desc">공식 Edge Add-ons에서 바로 설치할 수 있어 가장 간단합니다.</div>
      <span class="arrow">Edge 매뉴얼 보기 →</span>
    </a>

    <a class="browser" href="chrome.html">
      <div class="name">Google Chrome</div>
      <div class="desc">Chrome에서 KidsNote Backup을 설치하고 사용하는 방법입니다.</div>
      <span class="arrow">Chrome 매뉴얼 보기 →</span>
    </a>
  </div>

  <footer>KidsNote Backup 설치 안내</footer>
</main>
</body>
</html>
